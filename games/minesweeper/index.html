<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-FNZT8PLH08"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-FNZT8PLH08');</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Minesweeper</title>
  <link rel="stylesheet" href="style.css">
  <style>
  #start-overlay {
    position:fixed;top:0;left:0;width:100%;height:100%;
    background:rgba(15,15,26,0.95);display:flex;justify-content:center;
    align-items:center;z-index:50;
  }
  #start-overlay.hidden { display:none; }
  </style>
  <link rel="stylesheet" href="../platform.css">
  <script src="../platform.js"></script>
</head>
<body>
  <a href="/games/" style="position:fixed;top:12px;left:12px;z-index:100;color:#888;text-decoration:none;font:600 14px sans-serif;padding:6px 12px;background:rgba(26,26,46,0.85);border-radius:6px;transition:color .2s" onmouseover="this.style.color='#00d4ff'" onmouseout="this.style.color='#888'">&larr; Games</a>
  <div id="app">
    <header id="hud">
      <div id="mine-counter" class="hud-display">
        <span class="hud-icon">&#x1F4A3;</span>
        <span id="mine-count">010</span>
      </div>
      <div id="difficulty-selector">
        <button class="diff-btn active" data-difficulty="easy">Easy</button>
        <button class="diff-btn" data-difficulty="medium">Medium</button>
        <button class="diff-btn" data-difficulty="hard">Hard</button>
      </div>
      <div id="timer-display" class="hud-display">
        <span class="hud-icon">&#x23F1;</span>
        <span id="timer">00:00</span>
      </div>
    </header>

    <div id="board-wrapper">
      <div id="board"></div>
    </div>

    <div id="start-overlay">
      <div style="text-align:center;padding:30px">
        <h1 style="font-size:36px;margin-bottom:8px;color:#fff">Minesweeper</h1>
        <p style="color:#888;margin-bottom:16px">Classic mine-clearing puzzle</p>
        <div style="max-width:340px;text-align:left;margin:0 auto 16px;padding:14px 18px;background:rgba(255,255,255,0.04);border-radius:8px;font-size:13px;line-height:1.7;color:#aaa">
          <div style="font-size:11px;font-weight:700;letter-spacing:2px;color:#666;margin-bottom:8px;text-transform:uppercase">How to Play</div>
          Left click to reveal a cell<br>
          Right click or long-press to flag a mine<br>
          Numbers show adjacent mine count<br>
          Clear all non-mine cells to win<br>
          First click is always safe<br>
          3 difficulties: Easy, Medium, Hard
        </div>
        <button id="start-game-btn" style="padding:12px 36px;font-size:16px;font-weight:700;border:2px solid #00d4ff;border-radius:6px;background:transparent;color:#00d4ff;cursor:pointer;letter-spacing:1px">Start Game</button>
      </div>
    </div>

    <div id="overlay" class="hidden">
      <div id="overlay-content">
        <h2 id="overlay-title"></h2>
        <div id="overlay-stats"></div>
        <div id="high-scores-section" class="hidden">
          <h3>Best Times</h3>
          <ol id="high-scores-list"></ol>
        </div>
        <button id="play-again-btn">Play Again</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
  <script>
  document.getElementById('start-game-btn').addEventListener('click', function() {
    document.getElementById('start-overlay').classList.add('hidden');
  });
  </script>
</body>
</html>
