<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-FNZT8PLH08"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-FNZT8PLH08');</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Flappy Bird</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="../platform.css">
  <script src="../platform.js"></script>
</head>
<body>
  <a href="/games/" style="position:fixed;top:12px;left:12px;z-index:100;color:#888;text-decoration:none;font:600 14px sans-serif;padding:6px 12px;background:rgba(26,26,46,0.85);border-radius:6px;transition:color .2s" onmouseover="this.style.color='#00d4ff'" onmouseout="this.style.color='#888'">&larr; Games</a>
  <div id="game-wrapper">
    <div id="hud">
      <div id="hud-score-label">SCORE</div>
      <div id="hud-score">0</div>
    </div>
    <div id="canvas-container">
      <canvas id="game-canvas" width="400" height="600"></canvas>
      <!-- Start Screen Overlay -->
      <div id="start-overlay" class="overlay">
        <div class="overlay-content">
          <h1 class="game-title">Flappy Bird</h1>
          <div class="start-bird"></div>
          <div style="max-width:340px;text-align:left;margin:16px 0;padding:14px 18px;background:rgba(255,255,255,0.04);border-radius:8px;font-size:13px;line-height:1.7;color:#aaa">
            <div style="font-size:11px;font-weight:700;letter-spacing:2px;color:#666;margin-bottom:8px;text-transform:uppercase">How to Play</div>
            Click, tap, or press Space to flap<br>
            Navigate through gaps between pipes<br>
            Each pipe passed = +1 point<br>
            Gaps get smaller as you score higher<br>
            Don't hit pipes, ground, or ceiling
          </div>
          <p class="start-hint">Click or tap to start</p>
          <p class="start-controls">SPACE / Click / Tap to flap</p>
        </div>
      </div>
      <!-- Game Over Overlay -->
      <div id="gameover-overlay" class="overlay hidden">
        <div class="overlay-content">
          <h2 class="gameover-title">Game Over</h2>
          <div id="final-score-box">
            <div class="final-score-label">SCORE</div>
            <div id="final-score">0</div>
          </div>
          <div id="highscore-board">
            <h3>Top Scores</h3>
            <ol id="highscore-list"></ol>
          </div>
          <button id="play-again-btn">Play Again</button>
        </div>
      </div>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
