<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-FNZT8PLH08"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-FNZT8PLH08');</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Tron - Light Cycles</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a href="/games/" style="position:fixed;top:12px;left:12px;z-index:100;color:#888;text-decoration:none;font:600 14px sans-serif;padding:6px 12px;background:rgba(26,26,46,0.85);border-radius:6px;transition:color .2s" onmouseover="this.style.color='#00d4ff'" onmouseout="this.style.color='#888'">&larr; Games</a>
  <div id="game-container">
    <div id="hud">
      <span id="p1-score" class="score-cyan">P1: 0</span>
      <span id="round-info">Round 1</span>
      <span id="p2-score" class="score-magenta">P2: 0</span>
    </div>
    <canvas id="gameCanvas" width="600" height="600"></canvas>
    <div id="overlay">
      <h1>TRON</h1>
      <p class="tagline">Light Cycle Battle</p>
      <div id="controls-info">
        <div class="player-controls">
          <span class="label-cyan">Player 1</span>
          <span>W A S D</span>
        </div>
        <div class="vs">vs</div>
        <div class="player-controls">
          <span class="label-magenta">Player 2</span>
          <span>Arrow Keys</span>
        </div>
      </div>
      <button id="start-btn" class="btn btn-cyan">Start Game</button>
      <p id="overlay-sub" class="instructions">First to 5 wins. Don't crash!</p>
    </div>
    <div id="round-overlay" class="hidden">
      <h2 id="round-title"></h2>
      <p id="round-msg"></p>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
