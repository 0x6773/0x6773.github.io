<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-FNZT8PLH08"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-FNZT8PLH08');</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Breakout</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a href="/games/" style="position:fixed;top:12px;left:12px;z-index:100;color:#888;text-decoration:none;font:600 14px sans-serif;padding:6px 12px;background:rgba(26,26,46,0.85);border-radius:6px;transition:color .2s" onmouseover="this.style.color='#00d4ff'" onmouseout="this.style.color='#888'">&larr; Games</a>
  <div id="game-container">
    <div id="hud">
      <span id="score">Score: 0</span>
      <span id="level">Level: 1</span>
      <span id="lives">Lives: 3</span>
    </div>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div id="overlay">
      <h1 id="overlay-title">Breakout</h1>
      <p id="overlay-message">Click or tap to start</p>
      <div id="highscores" class="hidden">
        <h2>High Scores</h2>
        <ol id="score-list"></ol>
      </div>
      <button id="overlay-btn">Start Game</button>
    </div>
    <div id="powerup-hud"></div>
  </div>
  <script src="game.js"></script>
</body>
</html>
