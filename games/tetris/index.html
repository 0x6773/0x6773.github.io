<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-FNZT8PLH08"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-FNZT8PLH08');</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a href="/games/" style="position:fixed;top:12px;left:12px;z-index:100;color:#888;text-decoration:none;font:600 14px sans-serif;padding:6px 12px;background:rgba(26,26,46,0.85);border-radius:6px;transition:color .2s" onmouseover="this.style.color='#00d4ff'" onmouseout="this.style.color='#888'">&larr; Games</a>

  <div id="game-container">
    <div id="side-left">
      <div class="panel">
        <div class="panel-label">Hold</div>
        <canvas id="holdCanvas" width="120" height="80"></canvas>
      </div>
    </div>

    <div id="center">
      <div id="hud">
        <span id="score-display">Score: 0</span>
        <span id="level-display">Level: 1</span>
        <span id="lines-display">Lines: 0</span>
      </div>
      <canvas id="gameCanvas" width="300" height="600"></canvas>
    </div>

    <div id="side-right">
      <div class="panel">
        <div class="panel-label">Next</div>
        <canvas id="nextCanvas" width="120" height="260"></canvas>
      </div>
    </div>

    <div id="overlay">
      <h1>TETRIS</h1>
      <p id="overlay-sub">Click or press any key to start</p>
      <div id="highscores" class="hidden">
        <h2>High Scores</h2>
        <ol id="score-list"></ol>
      </div>
    </div>

    <!-- Power-up inventory -->
    <div id="powerup-bar">
      <span class="pu-label">POWER-UPS</span>
      <div id="pu-slots"></div>
      <span class="pu-hint">Press 1-3 or tap to use</span>
    </div>

    <!-- Color picker for Color Bomb -->
    <div id="color-picker" class="hidden">
      <p>Pick a color to remove:</p>
      <div id="color-options"></div>
    </div>

    <div id="touch-controls">
      <div class="touch-row">
        <button class="t-btn" data-action="hold">HOLD</button>
        <button class="t-btn accent" data-action="rotate">ROTATE</button>
      </div>
      <div class="touch-row">
        <button class="t-btn arrow" data-action="left">&#9664;</button>
        <button class="t-btn arrow" data-action="down">&#9660;</button>
        <button class="t-btn arrow" data-action="right">&#9654;</button>
        <button class="t-btn drop" data-action="drop">DROP</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
